<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A collection of farewell messages for Điệp.">
  <title>A special message for Điệp</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="screen intro-screen" id="intro-screen" aria-labelledby="intro-title">
      <div class="intro-content">
        <h1 id="intro-title">A special message for Điệp</h1>
        <button class="primary-button" id="unfold-button" type="button">Unfold</button>
      </div>
    </section>

    <section class="screen letters-screen" id="letters-screen" aria-labelledby="letters-title" hidden>
      <div class="letters-content">
        <h1 id="letters-title" tabindex="-1">For Điệp, before Japan.</h1>
        <ul class="letters-list" id="letters-list" aria-label="Letters for Điệp"></ul>
      </div>
    </section>
  </main>

  <dialog class="letter-dialog" id="letter-dialog" aria-labelledby="dialog-sender" aria-describedby="dialog-message">
    <div class="dialog-content">
      <button
        class="dialog-close"
        id="dialog-close"
        type="button"
        aria-label="Close letter"
        title="Close letter"
      >&times;</button>
      <p class="dialog-label">Letter from</p>
      <h2 id="dialog-sender"></h2>
      <p class="dialog-message" id="dialog-message"></p>
    </div>
  </dialog>
</body>
</html>
